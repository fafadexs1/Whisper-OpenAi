# Whisper Transcription API - Dialogy
# docker-compose para uso com EasyPanel ou local

services:
  whisper-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-api
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      # ── Modelo ──────────────────────────────────
      WHISPER_MODEL: ${WHISPER_MODEL}
      WHISPER_DEVICE: ${WHISPER_DEVICE}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS}
      WHISPER_NUM_WORKERS: ${WHISPER_NUM_WORKERS}
      # ── API ─────────────────────────────────────
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB}
      WHISPER_API_KEY: ${WHISPER_API_KEY}
      BASE_URL: ${BASE_URL}
    volumes:
      # Cache de modelos (evita re-download se o container recriar)
      - whisper-cache:/root/.cache
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  whisper-cache:
